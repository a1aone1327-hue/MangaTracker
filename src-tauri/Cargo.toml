[package]
name = "manga-tracker"
version = "0.1.0"
edition = "2021"
description = "Личный офлайн-трекер манги, манхвы и маньхуа"

[lib]
name = "manga_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sharekit = "0.3"
manga-core = { path = "../crates/core" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
ureq = "2"
