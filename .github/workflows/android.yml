name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

# contents: write нужен только чтобы по тегу v* прикрепить APK к релизу
permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Тесты ядра
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p manga-core

  logic:
    name: Тесты интерфейса (поиск, сортировка)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run test:logic

  apk:
    name: Сборка и подпись APK
    needs: [test, logic]
    runs-on: ubuntu-latest
    env:
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Проверить секреты подписи
        run: |
          for v in KS_B64 KS_PASS KEY_ALIAS KEY_PASS; do
            if [ -z "${!v}" ]; then
              echo "::error::Не задан секрет для $v. См. README, раздел «Ключ подписи»."
              exit 1
            fi
          done

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Найти Android NDK
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [ -z "$NDK" ]; then
            echo "::error::На раннере не найден Android NDK"
            exit 1
          fi
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Установить зависимости фронтенда
        run: npm install

      # Иконки нужны и до, и после init: так они попадают и в src-tauri/icons, и в Android-проект
      - name: Сгенерировать иконки и Android-проект
        run: |
          npx tauri icon app-icon.png
          npx tauri android init --ci
          npx tauri icon app-icon.png

      # Тёмная строка состояния и фон окна, чтобы при запуске не мелькало белое.
      # Если шаблон Tauri изменится и нужных файлов нет, шаг ничего не делает.
      - name: Оформить тему Android
        run: |
          python3 - <<'PY'
          import pathlib, re
          res = pathlib.Path("src-tauri/gen/android/app/src/main/res")
          if not res.exists():
              print("папка res не найдена, пропускаю")
              raise SystemExit(0)
          values = res / "values"
          values.mkdir(exist_ok=True)
          (values / "mt_colors.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              '    <color name="mt_bg">#12141f</color>\n</resources>\n',
              encoding="utf-8",
          )
          wanted = {
              "android:statusBarColor": "@color/mt_bg",
              "android:navigationBarColor": "@color/mt_bg",
              "android:windowBackground": "@color/mt_bg",
              "android:windowLightStatusBar": "false",
          }
          for f in res.glob("values*/themes.xml"):
              text = f.read_text(encoding="utf-8")
              items = "".join(
                  f'    <item name="{k}">{v}</item>\n' for k, v in wanted.items() if k not in text
              )
              if not items:
                  continue
              patched, n = re.subn(r'(<style\s+name="[^"]*"[^>]*>)', lambda m: m.group(1) + "\n" + items, text, count=1)
              if n:
                  f.write_text(patched, encoding="utf-8")
                  print("тема обновлена:", f)
          PY

      - name: Собрать release APK (arm64)
        run: |
          printf '{"bundle":{"android":{"versionCode":%s}}}' "${{ github.run_number }}" > ci-config.json
          npx tauri android build --apk --target aarch64 --config ci-config.json

      - name: Выровнять и подписать APK
        run: |
          UNSIGNED=$(find src-tauri/gen/android -path '*outputs/apk*' -name '*release*.apk' | head -n1)
          if [ -z "$UNSIGNED" ]; then
            echo "::error::Собранный APK не найден"
            find src-tauri/gen/android -name '*.apk'
            exit 1
          fi
          echo "Нашли: $UNSIGNED"
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KS_PASS \
            --key-pass env:KEY_PASS \
            --out manga-tracker.apk aligned.apk
          "$BT/apksigner" verify --print-certs manga-tracker.apk
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: manga-tracker-apk
          path: manga-tracker.apk
          retention-days: 30

      - name: Прикрепить APK к релизу (только для тегов v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: manga-tracker.apk
